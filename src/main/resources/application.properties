# 应用配置
spring.application.name=JackSparrow
server.port=8080

# 数据源配置文件位置
datasource.config.path=datasource.json

# SpringDoc OpenAPI 配置 (Swagger)
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

# Actuator 监控端点
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoint.info.enabled=true

# 日志配置
logging.level.root=INFO
logging.level.com.weilin=DEBUG
logging.level.org.springframework.web=INFO
logging.level.redis.clients.jedis=WARN
logging.level.org.elasticsearch=WARN

# 日志文件
logging.file.name=logs/jacksparrow.log
logging.file.max-size=10MB
logging.file.max-history=30

# JSON 格式化
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Shanghai
spring.jackson.serialization.write-dates-as-timestamps=false
