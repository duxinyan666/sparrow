version: '3.8'

services:
  # JackSparrow Application
  jacksparrow:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jacksparrow-app
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_OPTS=-Xms256m -Xmx512m
    volumes:
      - ./logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - jacksparrow-net
    restart: unless-stopped

  # Redis
  redis:
    image: redis:7-alpine
    container_name: jacksparrow-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jacksparrow-net
    restart: unless-stopped

  # Elasticsearch
  elasticsearch:
    image: elasticsearch:7.9.3
    container_name: jacksparrow-es
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - jacksparrow-net
    restart: unless-stopped

volumes:
  redis-data:
    driver: local
  es-data:
    driver: local

networks:
  jacksparrow-net:
    driver: bridge
